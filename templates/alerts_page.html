
{% extends 'base.html' %}

{% block title %}Disaster Alerts - ResQNow{% endblock %}

{% block content %}

<div class="container mt-4 mb-5">

    <div class="text-center mb-4">
        <h2>📢 Disaster Alerts</h2>
        <p class="text-muted">
            Stay informed about reported emergencies and disaster situations.
        </p>
    </div>

    <div id="alertsContainer" class="row">
        <div class="col-12 text-center">
            <p>Loading latest alerts...</p>
        </div>
    </div>

</div>

<script>
async function loadAlerts() {
    const container = document.getElementById("alertsContainer");

    try {
        const response = await fetch("/emergencies");

        if (!response.ok) {
            throw new Error("Unable to fetch alerts");
        }

        const data = await response.json();
        const alerts = data.emergencies || [];

        container.innerHTML = "";

        if (alerts.length === 0) {
            container.innerHTML = `
                <div class="col-12 text-center">
                    <div class="alert alert-info">
                        No disaster alerts available at the moment.
                    </div>
                </div>`;
            return;
        }

        alerts.reverse().forEach(alert => {
            const col = document.createElement("div");
            col.className = "col-md-6 mb-3";

            const card = document.createElement("div");
            card.className = "card shadow-sm h-100";

            const body = document.createElement("div");
            body.className = "card-body";

            const heading = document.createElement("h5");
            heading.className = "card-title";
            heading.textContent = alert.title || alert.disaster_type;

            const severity = document.createElement("span");
            severity.className = "badge " +
                (alert.severity === "critical" || alert.severity === "high"
                    ? "bg-danger"
                    : alert.severity === "medium"
                        ? "bg-warning text-dark"
                        : "bg-success");

            severity.textContent =
                (alert.severity || "unknown").toUpperCase();

            const location = document.createElement("p");
            location.className = "mt-3";
            location.textContent = "📍 Location: " + (alert.location || "Not specified");

            const type = document.createElement("p");
            type.textContent = "Disaster: " + (alert.disaster_type || "Not specified");

            const description = document.createElement("p");
            description.textContent = alert.description || "No description available.";

            const status = document.createElement("p");
            status.textContent = "Status: " + (alert.status || "Pending");

            body.append(heading, severity, location, type, description, status);
            card.appendChild(body);
            col.appendChild(card);
            container.appendChild(col);
        });

    } catch (error) {
        console.error(error);

        container.innerHTML = `
            <div class="col-12">
                <div class="alert alert-danger">
                    Unable to load disaster alerts. Please try again.
                </div>
            </div>`;
    }
}

loadAlerts();
</script>

{% endblock %}
</div>
