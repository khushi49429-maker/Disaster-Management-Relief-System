
{% extends 'base.html' %}

{% block title %}Rescue Team{% endblock %}

{% block content %}

<div class="container py-5">

    <h2>🚑 Rescue Team Dashboard</h2>
    <p>View and manage reported emergencies.</p>

    <div id="message"></div>

    <div class="table-responsive">

        <table class="table table-bordered table-striped">

            <thead class="table-dark">
                <tr>
                    <th>Emergency ID</th>
                    <th>Title</th>
                    <th>Disaster</th>
                    <th>Location</th>
                    <th>People Affected</th>
                    <th>Priority</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="emergencyTable">
                <tr>
                    <td colspan="7" class="text-center">
                        Loading emergencies...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

<script>

async function loadEmergencies() {

    const table = document.getElementById("emergencyTable");
    const message = document.getElementById("message");

    try {

        const response = await fetch("/emergencies");
        const result = await response.json();

        table.innerHTML = "";

        if (!response.ok) {
            table.innerHTML = `
                <tr>
                    <td colspan="7">${result.message}</td>
                </tr>
            `;
            return;
        }

        if (!result.emergencies || result.emergencies.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center">
                        No emergency reports available.
                    </td>
                </tr>
            `;

            return;
        }

        result.emergencies.forEach(function(e) {

            const row = document.createElement("tr");

            const values = [
                e.emergency_id,
                e.title,
                e.disaster_type,
                e.location,
                e.people_affected,
                e.severity,
                e.status
            ];

            values.forEach(function(value) {

                const cell = document.createElement("td");
                cell.textContent = value ?? "N/A";
                row.appendChild(cell);

            });

            table.appendChild(row);

        });

    } catch (error) {

        message.innerHTML =
            '<div class="alert alert-danger">Unable to load emergency reports.</div>';

        console.error(error);

    }

}

loadEmergencies();

</script>

{% endblock %}
